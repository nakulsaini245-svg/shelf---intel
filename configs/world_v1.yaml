# world_v1.yaml: every assumption of the synthetic quick-commerce dairy world.
#
# EVERYTHING HERE IS AN ASSUMPTION, not a measured fact. Brands are fictional;
# any resemblance to real companies is coincidental. Numbers are chosen to be
# plausible, then calibrated against the `targets` block at the bottom.
# Unknown keys are rejected by the loader, so typos fail loudly.

version: 1
seed: 20261121            # global seed; same seed + config => byte-identical data
start_date: "2026-08-23"  # day 0. With n_days=90 the last day is 2026-11-20.
n_days: 90

# ---------------------------------------------------------------- scale
scale:
  n_pincodes: 75
  n_zones: 8
  zone_sizes: [12, 10, 10, 9, 9, 9, 8, 8]      # must sum to n_pincodes (null = even split)
  zone_affluence: [high, high, mid, mid, mid, low, mid, low]   # cycled if shorter than n_zones
  # Illustrative labels only. Pincode ids are synthetic ("NCR-001"), not real postal codes.
  zone_labels: [South Delhi, Central Delhi, West Delhi, East Delhi, North Delhi, Noida, Gurugram, Ghaziabad-Faridabad]
  stores_per_platform: 20
  n_skus: 135
  platform_listing_share: 0.65    # share of the SKU master each platform lists
  hero_share: 0.15                # top-popularity SKUs listed on every platform
  unserviced_share: 0.10          # share of platform x pincode cells with no coverage
  focal_skus_per_subcat: {paneer: 3, cheese: 3, curd: 3, chaach: 2, milk: 3}

# ---------------------------------------------------------------- catalogue
# base_price_per_kg is MRP per kg (or litre) before brand/pack adjustments.
# mix = relative share of the SKU master. volume_mult scales unit demand.
subcats:
  paneer: {base_price_per_kg: 380, packs: [200, 400, 1000], variants: [classic, low-fat], unit: g,
           shelf_life_days: 12, case_size: 12, elasticity: 1.6, seasonal_amp: 0.12, seasonal_peak_doy: 355,
           unit_cost_pct: 0.74, mix: 25, volume_mult: 1.0}
  cheese: {base_price_per_kg: 480, packs: [200, 400, 1000], variants: [slices, block, spread], unit: g,
           shelf_life_days: 90, case_size: 12, elasticity: 1.3, seasonal_amp: 0.10, seasonal_peak_doy: 360,
           unit_cost_pct: 0.76, mix: 30, volume_mult: 0.7}
  curd:   {base_price_per_kg: 85, packs: [200, 400, 1000], variants: [classic, greek, probiotic], unit: g,
           shelf_life_days: 10, case_size: 12, elasticity: 1.8, seasonal_amp: 0.25, seasonal_peak_doy: 160,
           unit_cost_pct: 0.80, mix: 30, volume_mult: 1.3}
  chaach: {base_price_per_kg: 50, packs: [200, 500, 1000], variants: [plain, masala], unit: ml,
           shelf_life_days: 7, case_size: 24, elasticity: 1.5, seasonal_amp: 0.35, seasonal_peak_doy: 150,
           unit_cost_pct: 0.78, mix: 15, volume_mult: 0.8}
  milk:   {base_price_per_kg: 62, packs: [500, 1000], variants: [full-cream, toned, double-toned], unit: ml,
           shelf_life_days: 3, case_size: 24, elasticity: 0.7, seasonal_amp: 0.05, seasonal_peak_doy: 355,
           unit_cost_pct: 0.88, mix: 35, volume_mult: 1.8}

# Index = pack position (smallest first); the last entry is reused for longer lists.
pack_pop_mult: [1.3, 1.0, 0.55]       # smaller packs sell more units
pack_price_mult: [1.08, 1.0, 0.90]    # larger packs are cheaper per kg
variant_pop_mult: [1.2, 1.0, 0.7]

# archetype is descriptive. ad_strength = relative sponsored bid; ad_participation = probability
# the brand runs ads on a platform-day; price_index scales MRP; discount_mult scales structural
# discount; promo_mult scales promo frequency; assort_weight = chance of holding a SKU slot.
brands:
  - {name: Arvana,           archetype: national_leader,  is_focal: true,  ad_strength: 1.0, ad_participation: 0.85, price_index: 1.00, discount_mult: 0.6, promo_mult: 0.8, assort_weight: 1.0, pop_mult: 1.4}
  - {name: Milkora,          archetype: challenger,       is_focal: false, ad_strength: 1.2, ad_participation: 0.90, price_index: 0.94, discount_mult: 1.6, promo_mult: 1.6, assort_weight: 1.0, pop_mult: 1.1}
  - {name: Pure Pastures,    archetype: premium_organic,  is_focal: false, ad_strength: 0.8, ad_participation: 0.60, price_index: 1.30, discount_mult: 0.5, promo_mult: 0.6, assort_weight: 0.7, pop_mult: 0.7}
  - {name: Krishi Valley,    archetype: premium_organic,  is_focal: false, ad_strength: 0.7, ad_participation: 0.50, price_index: 1.25, discount_mult: 0.5, promo_mult: 0.6, assort_weight: 0.6, pop_mult: 0.6}
  - {name: Haveli Naturals,  archetype: regional,         is_focal: false, ad_strength: 0.6, ad_participation: 0.55, price_index: 0.97, discount_mult: 1.0, promo_mult: 1.0, assort_weight: 0.8, pop_mult: 0.9}
  - {name: Doodhwala Co,     archetype: regional,         is_focal: false, ad_strength: 0.5, ad_participation: 0.45, price_index: 0.95, discount_mult: 1.0, promo_mult: 1.0, assort_weight: 0.8, pop_mult: 0.8}
  - {name: Lotus Creamery,   archetype: challenger,       is_focal: false, ad_strength: 0.9, ad_participation: 0.70, price_index: 1.00, discount_mult: 1.3, promo_mult: 1.3, assort_weight: 0.9, pop_mult: 0.9}
  - {name: FreshNest,        archetype: private_label,    is_focal: false, ad_strength: 0.3, ad_participation: 0.25, price_index: 0.88, discount_mult: 0.3, promo_mult: 0.5, assort_weight: 0.9, pop_mult: 1.0}
  - {name: CityBasket Select, archetype: private_label,   is_focal: false, ad_strength: 0.3, ad_participation: 0.25, price_index: 0.86, discount_mult: 0.3, promo_mult: 0.5, assort_weight: 0.8, pop_mult: 0.9}

# demand_idx = platform traffic scale. price_aggressiveness scales structural discount.
# ad_intensity scales ad participation. restock_reliability = mean order fill ratio.
# flakiness scales scrape failure probability.
platforms:
  - {id: P1, name: "Platform-1 (Blinkit-like)",  demand_idx: 1.15, price_aggressiveness: 1.00, ad_intensity: 1.0, restock_reliability: 0.94, flakiness: 1.0}
  - {id: P2, name: "Platform-2 (Zepto-like)",    demand_idx: 1.00, price_aggressiveness: 1.15, ad_intensity: 0.9, restock_reliability: 0.92, flakiness: 1.3}
  - {id: P3, name: "Platform-3 (Instamart-like)", demand_idx: 0.85, price_aggressiveness: 0.95, ad_intensity: 1.1, restock_reliability: 0.96, flakiness: 0.8}

# ---------------------------------------------------------------- demand
demand:
  base_units_per_cell_day: 1.3        # mean daily units for a pop=1 SKU in a demand_idx=1 pincode
  nb_dispersion: 8.0                  # negative-binomial r; smaller = noisier
  pop_sigma: 0.7                      # lognormal sigma of SKU popularity
  demand_index_sigma: 0.25            # lognormal sigma of pincode demand index
  affluence_mult: {high: 1.35, mid: 1.0, low: 0.7}
  dow_mult: [0.95, 0.95, 0.97, 1.00, 1.05, 1.12, 1.10]   # Mon..Sun
  period_weights: [0.08, 0.30, 0.30, 0.32]   # demand share in the 4 periods ending at each snapshot
  promo_display_lift: 1.10            # extra lift from promo visibility, on top of price elasticity
  sov_eta: 0.25                       # demand response to relative change in brand ad share-of-voice
  cross_elasticity_ratio: 0.5         # cross-price elasticity = ratio x own elasticity
  demand_mult_clip: [0.2, 3.0]
  baseline_unlist_prob: 0.0005        # random one-day delisting of a SKU in a platform x pincode cell
  # Approximate dates, synthetic effect sizes. Known calendar => usable as a model covariate.
  festivals:
    - {name: Raksha Bandhan, date: "2026-08-28", window_days: 4, mult: {paneer: 1.15, cheese: 1.00, curd: 1.05, chaach: 1.00, milk: 1.10}}
    - {name: Janmashtami,    date: "2026-09-04", window_days: 3, mult: {paneer: 1.10, cheese: 1.00, curd: 1.30, chaach: 1.10, milk: 1.25}}
    - {name: Navratri,       date: "2026-10-14", window_days: 5, mult: {paneer: 1.20, cheese: 0.95, curd: 1.20, chaach: 1.15, milk: 1.15}}
    - {name: Dussehra,       date: "2026-10-20", window_days: 3, mult: {paneer: 1.25, cheese: 1.05, curd: 1.10, chaach: 1.00, milk: 1.10}}
    - {name: Diwali,         date: "2026-11-08", window_days: 5, mult: {paneer: 1.40, cheese: 1.15, curd: 1.00, chaach: 0.95, milk: 1.30}}

# ---------------------------------------------------------------- inventory
inventory:
  warmup_days: 14                     # simulated before day 0 and discarded
  ewma_alpha: 0.15                    # planner's demand forecast smoothing (on SALES, so stockouts depress it)
  # Calibrated (30-day sweep, see docs): cover 1.6 gave 0.5% stockouts (too rare); 0.2 gives ~5.6%.
  # Lean dark-store replenishment: little safety stock beyond lead time.
  cover_days: 0.2                     # order-up-to = forecast x (lead time + cover_days)
  min_presentation_units: 3
  fill_sd: 0.08                       # sd of per-order fill ratio around platform restock_reliability
  delay_base: 0.15                    # delay probability scale (x (1-reliability)/0.08)
  topup_prob: 0.30                    # chance of an emergency mid-day top-up after a stockout (x reliability)
  writeoff_scale: 0.3                 # daily write-off fraction = scale / shelf_life_days
  initial_cover_days: 2.0
  store_lead_time_p2: 0.35            # share of dark stores with a 2-day supplier lead time (else 1)

# ---------------------------------------------------------------- pricing
pricing:
  base_structural_discount: 0.05
  structural_discount_sigma: 0.30
  promo_start_prob: 0.025             # per platform x SKU x day, scaled by brand promo_mult
  promo_len_range: [3, 7]
  promo_depth_range: [0.06, 0.18]
  match_tolerance: 0.04               # a platform matches when another is >4% cheaper
  match_prob: 0.50                    # daily probability of matching (the lag)
  max_discount: 0.35                  # hard floor: price >= MRP x (1 - max_discount)

# ---------------------------------------------------------------- ads / search visibility
ads:
  n_slots: 10
  sponsored_positions: [1, 4, 7]
  snapshots: [2, 3]                   # which availability snapshots (1..4) also capture search results
  gumbel_sponsored: 0.5
  gumbel_organic: 0.8
  w_conv: 0.6                         # organic rank weight on availability history (stockouts hurt later ranks)
  w_price: 0.8                        # organic rank weight on price per kg vs group median
  oos_penalty: 3.0
  pacing_sigma: 0.25
  conv_ema_alpha: 0.10

# ---------------------------------------------------------------- observation (scraper) layer
observation:
  snapshot_hours: [6, 12, 18, 22]
  p_timeout: 0.02                     # MCAR failure per platform x pincode x snapshot
  evening_extra: 0.03                 # MNAR: extra failure probability at snapshots 3 and 4
  p_serviceability_error: 0.004       # transient false "unserviceable" response
  p_stale: 0.01                       # snapshot silently returns the previous snapshot's values

# ---------------------------------------------------------------- calibration targets
# Validator checks that each marginal lies in [lo, hi]. These are assumed plausible
# ranges, not empirical benchmarks.
targets:
  oos_rate_snapshot: [0.04, 0.14]     # share of listed cell-snapshots truly out of stock
  mean_discount_pct: [4.0, 14.0]
  promo_share: [0.06, 0.30]
  scrape_fail_rate: [0.02, 0.10]      # share of serviceable platform x pincode x snapshot scrapes that failed
  unserviced_share: [0.05, 0.15]
  top3_brand_sponsored_share: [0.45, 0.90]
  focal_fill_rate: [0.85, 0.99]       # units sold / units demanded for the focal brand
  mean_units_per_cell_day: [0.6, 3.0]
